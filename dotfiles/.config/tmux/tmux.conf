# Miscs
set -g default-terminal "tmux-256color"

unbind C-b
set -g prefix `
bind ` send-prefix
bind r source-file ~/.tmux.conf
set -g status-position top

# Window
set -g base-index 1
set -w -g pane-base-index 1
set -g renumber-windows on
bind | split-window -h
bind - split-window -v

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -r C-h select-window -t :-
bind -r C-l select-window -t :+

# Mouse
set -g mouse on
bind -Tcopy-mode WheelUpPane send -N1 -X scroll-up
bind -Tcopy-mode WheelDownPane send -N1 -X scroll-down

set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.tmux/plugins/"

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'

# Copy tmux selections to the host clipboard across WSL, Wayland, X11, and macOS.
set -g @override_copy_command "sh -c 'if printenv WAYLAND_DISPLAY >/dev/null 2>&1 && command -v wl-copy >/dev/null 2>&1; then wl-copy; elif printenv DISPLAY >/dev/null 2>&1 && command -v xclip >/dev/null 2>&1; then xclip -selection clipboard; elif printenv DISPLAY >/dev/null 2>&1 && command -v xsel >/dev/null 2>&1; then xsel -ib; elif command -v clip.exe >/dev/null 2>&1; then clip.exe; elif [ -x /mnt/c/Windows/System32/clip.exe ]; then /mnt/c/Windows/System32/clip.exe; elif command -v pbcopy >/dev/null 2>&1; then pbcopy; else cat >/dev/null; exit 1; fi'"
set -g @yank_with_mouse on

set -g @catppuccin_flavor "mocha"
set -g @catppuccin_status_background "none"
set -g @catppuccin_window_status_style "none"
set -g @catppuccin_pane_status_enabled "off"
set -g @catppuccin_pane_border_status "off"
run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux

# Configure Catppuccin
set -g @thm_bg "#222222"
set -gF status-style "bg=#{@thm_bg}"

# Status left
set -g status-left-length 100
set -g status-left ""
set -ga status-left "#{?client_prefix,#{#[bg=#{@thm_bg},fg=#{@thm_red},bold]  #S },#{#[bg=#{@thm_bg},fg=#{@thm_green}]  #S }}"
set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_overlay_0},none]│"
set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_maroon}]  #{pane_current_command} "
set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_overlay_0},none]│"
set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_blue}]  #{=/-32/...:#{s|$USER|~|:#{b:pane_current_path}}} "
set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_overlay_0},none]#{?window_zoomed_flag,│,}"
set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_yellow}]#{?window_zoomed_flag,  zoom ,}"

# Status right
set -g status-right-length 100
set -g status-right ""
set -ga status-right "#[bg=#{@thm_bg},fg=#{@thm_blue}] 󰭦 %Y-%m-%d 󰅐 %H:%M "

set -g status-justify "centre"

# Window look and feel
set -wg automatic-rename on
set -g automatic-rename-format "Window"

set -g window-status-format " #I#{?#{!=:#{window_name},Window},: #W,} "
set -g window-status-style "bg=#{@thm_bg},fg=#{@thm_rosewater}"
set -g window-status-last-style "bg=#{@thm_bg},fg=#{@thm_peach}"
set -g window-status-activity-style "bg=#{@thm_red},fg=#{@thm_bg}"
set -g window-status-bell-style "bg=#{@thm_red},fg=#{@thm_bg},bold"
set -gF window-status-separator "#[bg=#{@thm_bg},fg=#{@thm_overlay_0}]│"

set -g window-status-current-format "#[bg=#{@thm_peach},fg=#{@thm_bg},bold] #I#{?#{!=:#{window_name},Window},: #W,} #[default]"
set -g window-status-current-style "bg=#{@thm_peach},fg=#{@thm_bg},bold"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

